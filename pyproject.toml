[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "not-monge"
version = "0.1.0"
description = "Research-grade neural optimal transport and diffusion benchmarking framework."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "David Millard" }
]
dependencies = [
  "torch>=2.8,<2.9",
  "torchvision>=0.23,<0.24",
  "numpy>=2.0,<3.0",
  "scipy>=1.13,<2.0",
  "hydra-core>=1.3,<1.4",
  "omegaconf>=2.3,<2.4",
  "wandb>=0.25,<0.26",
  "timm>=1.0.26,<1.1",
  "diffusers>=0.36,<0.37",
  "POT>=0.9.6,<0.10",
  "torchdiffeq>=0.2.4,<0.3",
  "pypdf>=6.0,<7.0",
  "pillow>=11.0,<12.0",
  "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.11,<0.12",
]

[tool.setuptools]
packages = [
  "src",
  "src.diagnostics",
  "src.models",
  "src.solvers",
  "src.datasets",
  "src.training",
  "src.evaluation",
  "src.utils",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "unit: fast unit tests for isolated modules",
  "integration: multi-module and training-loop tests",
  "smoke: end-to-end minimal execution tests",
]
