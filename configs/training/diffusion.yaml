seed: 1234
max_epochs: 100
max_steps: null
log_every_n_steps: 50
validate_every_n_epochs: 1
gradient_clip_norm: 1.0
precision: fp32
compile: false
deterministic: false
device: auto
num_workers: 0
pin_memory: false
optimizer:
  lr: 2.0e-4
  weight_decay: 1.0e-4
  pct_start: 0.1
  div_factor: 25.0
  final_div_factor: 1000.0
logging:
  backend: console
  project: not-monge
  wandb_mode: offline
checkpointing:
  dirpath: checkpoints
  save_every_n_epochs: 5
  monitor: val/ddpm_loss
  mode: min
