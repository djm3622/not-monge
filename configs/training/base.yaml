seed: 1234
max_epochs: 1000
max_steps: 1000
log_every_n_steps: 20
validate_every_n_epochs: 1
gradient_clip_norm: 0.5
precision: fp32
compile: false
deterministic: false
device: auto
num_workers: 0
pin_memory: false
optimizer:
  lr: 3.0e-4
  weight_decay: 3.0e-4
  pct_start: 0.3
  div_factor: 25.0
  final_div_factor: 1000.0
fairness:
  batch_size: 512
  max_steps: 1000
  optimizer: adamw
  scheduler: onecycle
logging:
  backend: console
  project: not-monge
  wandb_mode: offline
checkpointing:
  dirpath: checkpoints
  save_every_n_epochs: 1
  monitor: val/map_l2
  mode: min
