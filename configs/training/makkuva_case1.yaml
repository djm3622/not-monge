seed: 1234
max_epochs: 1000
max_steps: 100000
log_every_n_steps: 100
validate_every_n_epochs: 1
gradient_clip_norm: 1.0
precision: fp32
compile: false
deterministic: false
device: auto
num_workers: 0
pin_memory: false
optimizer:
  lr: 1.0e-4
  weight_decay: 0.0
  pct_start: 0.3
  div_factor: 25.0
  final_div_factor: 1000.0
fairness:
  batch_size: 1024
  max_steps: 100000
  optimizer: adam
  scheduler: none
logging:
  backend: console
  project: not-monge
  wandb_mode: offline
checkpointing:
  dirpath: checkpoints
  save_every_n_epochs: 1
  monitor: val/pushforward_w2
  mode: min
