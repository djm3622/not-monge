name: otm
potential:
  kind: denseicnn
  hidden_dims: [128, 128, 64]
  activation: celu
  strong_convexity: 1.0e-4
  identity_quadratic: 0.0
transport_steps: 1
potential_steps: 1
transport_lr: 5.0e-4
potential_lr: 5.0e-4
use_c_concave_parameterization: false
transport_l2_weight: 0.0
dot_reward_scale: 0.015625
gradient_optimality_weight: 0.1
noise:
  kind: additive_gaussian
  sigma_start: 0.0
  sigma_end: 0.0
optimizer:
  betas: [0.0, 0.9]
  weight_decay: 0.0
gradient_clip_enabled: false
compile: false
